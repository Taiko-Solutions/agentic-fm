# agent/scripts/hooks/paths.conf — reglas de rutas compartidas por el hook pre-push,
# agentic-fm-safe-push y la GitHub Action (las lee agent/scripts/check_pushed_paths.py).
# Una expresión regular (Python) por línea, aplicada a la ruta relativa al repo.
# Líneas vacías y las que empiezan por # se ignoran.

[forbidden]
# NUNCA se versionan en ningún git, en ninguna rama (datos de cliente / credenciales)
^xml_exports/
^agent/xml_parsed/
^agent/context/
^agent/CONTEXT\.json$
^agent/sandbox/.*\.xml$
^agent/config/.*\.(json|md)$

[whitelist]
# Excepciones legítimas a [forbidden]
\.example(\..*)?$
^agent/config/fmlint\.config\.json$
^agent/sandbox/script\.xml$

[allow]
# Capa herramientas: lo ÚNICO que puede subir desde un clon de cliente (cualquier rama)
^\.claude/
^\.github/
^\.mcp\.json$
^\.gitignore$
^AGENTS\.md$
^README\.md$
^UPDATES\.md$
^TAIKO-UPDATES\.md$
^ARCHITECTURE\.md$
^QUICKSTART\.md$
^ROADMAP\.md$
^version\.txt$
^fmcontext\.sh$
^fmparse\.sh$
^filemaker/
^webviewer/
^ops/
^agent/docs/
^agent/scripts/
^agent/fmlint/
^agent/catalogs/
^agent/fixtures/
^agent/library/
^agent/snippet_examples/
^agent/templates/
^agent/UPSTREAM_PROPOSALS\.md$
^agent/CONTEXT\.example\.json$
^agent/config/[^/]+\.example(\..*)?$
^agent/config/fmlint\.config\.json$
^agent/sandbox/script\.xml$

[changelog-trigger]
# Si una rama de clon toca estas rutas sin tocar TAIKO-UPDATES.md → aviso (no bloqueo)
^\.claude/
^agent/docs/
^agent/fmlint/
^agent/catalogs/
^agent/fixtures/
^agent/scripts/
^filemaker/
